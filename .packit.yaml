# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: tmp/copr.spec
actions:
  post-upstream-clone:
    - mkdir -p tmp
    - cp tools/copr.spec tmp/
    - sed -i -e '/^PLACEHOLDER_POSTINSTALL$/r tools/postinstall.sh' -e '/^PLACEHOLDER_POSTINSTALL$/d' tmp/copr.spec
    - sed -i -e '/^PLACEHOLDER_PREREMOVE$/r tools/preremove.sh' -e '/^PLACEHOLDER_PREREMOVE$/d' tmp/copr.spec
    - sed -i -e '/^PLACEHOLDER_POSTREMOVE$/r tools/postremove.sh' -e '/^PLACEHOLDER_POSTREMOVE$/d' tmp/copr.spec

# name in upstream package repository or registry (e.g. in PyPI)
upstream_package_name: simple-fileserver
# downstream (Fedora) RPM package name
downstream_package_name: simple-fileserver

targets:
  - fedora-all-x86_64
  - fedora-all-aarch64
additional_repos:
  - copr://heathcliff26/golang

jobs:
  - job: copr_build
    trigger: pull_request
    branch: main

  - job: copr_build
    trigger: release
    owner: heathcliff26
    project: cli
